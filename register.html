<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | Meghu Travels</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
<a class="brand auth-brand" href="index.html"><span class="brand-mark">M</span> meghu<span>travels</span></a>
<main class="auth-card">
    <a class="back-link" href="index.html">← Back to home</a>
    <span class="eyebrow">YOUR NEXT JOURNEY STARTS HERE</span><h1>Let’s get going.</h1><p>Create an account and make every booking a little easier.</p>
    <form action="register" method="post" class="form-stack">
        <label>Full name<input type="text" name="fullName" autocomplete="name" placeholder="Your name" required maxlength="100"></label>
        <label>Email address<input type="email" name="email" autocomplete="email" placeholder="you@example.com" required maxlength="190"></label>
        <label>Phone number<input type="tel" name="phone" autocomplete="tel" placeholder="+91 98765 43210" required maxlength="30"></label>
        <label>Password<input type="password" name="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8" maxlength="72"></label>
        <button class="button button-full" type="submit">Create account <span aria-hidden="true">→</span></button>
    </form>
    <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
</main>
<div class="auth-decoration"><span>✦</span><p>More than a ride.<br>A better way to travel.</p><small>WELCOME TO MEGHU TRAVELS</small></div>
</body></html>
